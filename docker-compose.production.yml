name: my-drivev2-production

services:
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the repository root .env file}
      DATA_FILE: /app/data/drive-store.json
      UPLOAD_DIR: /app/uploads
      REGISTRATION_INVITES: ${REGISTRATION_INVITES?Set REGISTRATION_INVITES in the repository root .env file}
      PUBLIC_API_URL: https://${DOMAIN:?Set DOMAIN in the repository root .env file}/api
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in the repository root .env file}
    expose:
      - "5000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        REACT_APP_REGISTRATION_INVITE_REQUIRED: "true"
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the repository root .env file}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
