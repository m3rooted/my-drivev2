services:
  backend:
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the repository root .env file}
      DATA_FILE: /app/data/drive-store.json
      UPLOAD_DIR: /app/uploads
      PUBLIC_API_URL: http://127.0.0.1:5000/api
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      REACT_APP_API_URL: http://127.0.0.1:5000/api
      HOST: 0.0.0.0
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  backend_node_modules:
  frontend_node_modules:
